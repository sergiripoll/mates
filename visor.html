<!doctype html><html lang="ca"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fitxa</title><link rel="stylesheet" href="style.css">
<script>window.MathJax={tex:{inlineMath:[['\\(','\\)']],displayMath:[['\\[','\\]']]},svg:{fontCache:'global'}};</script>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script async src="https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-svg.js"></script></head><body>
<header class="nav"><a href="index.html">← Índex</a> <span id="tema"></span> <button onclick="print()">Imprimeix / PDF</button></header>
<main><article id="a">Carregant…</article><nav id="pn" class="pn"></nav></main>
<script>
const f=new URLSearchParams(location.search).get('f');
const BL={teoria:'Teoria',exercicis:'Exercicis',selectivitat:'Selectivitat'};
fetch('materials.json').then(r=>r.json()).then(D=>{
 const cur=D.find(d=>d.path===f);if(!cur)return;
 const dir=p=>p.replace(/\/[^/]*$/,'');
 const sib=D.filter(d=>dir(d.path)===dir(f)).sort((a,b)=>a.ordre-b.ordre);
 const lab=d=>d.bloc==='selectivitat'&&d.curs==='1r'?'Difícils i exàmens':(BL[d.bloc]||d.title);
 const lnk=d=>`visor.html?f=${encodeURIComponent(d.path)}`;
 document.getElementById('tema').innerHTML='· <b>'+(cur.tematitol||cur.title)+'</b> '+sib.map(d=>d.path===f?`<span class="chip on">${lab(d)}</span>`:`<a class="chip" href="${lnk(d)}">${lab(d)}</a>`).join('');
 const i=sib.findIndex(d=>d.path===f),pv=sib[i-1],nx=sib[i+1];
 document.getElementById('pn').innerHTML=(pv?`<a href="${lnk(pv)}">← ${lab(pv)}</a>`:'<span></span>')+(nx?`<a href="${lnk(nx)}">${lab(nx)} →</a>`:'<span></span>');
}).catch(()=>{});
fetch(f).then(r=>r.text()).then(t=>{
 t=t.replace(/^---\r?\n[\s\S]*?\r?\n---\r?\n/,'');const M=[];
 // protegeix les fórmules perquè marked no les malmeti
 t=t.replace(/\$\$([\s\S]+?)\$\$|(?<!\\)\$([^\n$]+?)(?<!\\)\$/g,(s,a,b)=>{M.push(a!==undefined?'\\['+a+'\\]':'\\('+b+'\\)');return '@@M'+(M.length-1)+'@@'});
 let h=marked.parse(t).replace(/@@M(\d+)@@/g,(s,i)=>M[i]);
 const el=document.getElementById('a');el.innerHTML=h;
 const base=f.slice(0,f.lastIndexOf('/')+1);
 el.querySelectorAll('img').forEach(i=>{const s=i.getAttribute('src');if(s&&!/^(https?:|\/|data:)/.test(s))i.src=base+s});
document.title=(el.querySelector('h1')||{}).textContent||'Fitxa';
 const go=()=>window.MathJax&&MathJax.typesetPromise?MathJax.typesetPromise([el]):setTimeout(go,150);go();
}).catch(()=>document.getElementById('a').textContent='No s\'ha pogut carregar la fitxa.');
</script></body></html>
